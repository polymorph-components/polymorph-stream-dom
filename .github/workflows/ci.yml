# Runs exactly the justfile recipes, in order. New gates belong in the
# justfile; this file only supplies a machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.5"
  WASM_TOOLS_VERSION: "1.247.0"
  JUST_VERSION: "1.54.0"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Toolchain version and targets come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
          components: clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-tools@${{ env.WASM_TOOLS_VERSION }},cargo-binstall
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests/web-sys
            host
      # The desktop crate (host/desktop) links webkit2gtk/gtk3; its
      # WebDriver smoke test also needs WebKitWebDriver + Xvfb (no
      # display on this runner).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev webkit2gtk-driver xvfb
      - run: just check
      - run: just test
      - run: just components
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Chromium plus its shared-library deps; the justfile's own install
      # step is the browser binary only and is a no-op after this.
      - run: npx -y playwright@1.58 install --with-deps chromium
      - run: just e2e
      - run: just bench-wire
      # Prebuilt: `cargo install` would compile it on every run.
      - run: cargo binstall -y tauri-driver
      - run: just desktop-smoke
