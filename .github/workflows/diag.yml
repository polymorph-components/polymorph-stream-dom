# Runs the tachometer benchmark matrix and publishes results to the
# `gh-pages` branch's `bench/` history (dispatch: "bench" track), read by
# github-action-benchmark's own chart page and by pages.yml's copy into
# `dist/bench/`.
name: diag

on:
  push:
    branches: [bench-diag]

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DENO_VERSION: "2.9.5"
  WASM_TOOLS_VERSION: "1.247.0"
  JUST_VERSION: "1.54.0"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
          components: clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-tools@${{ env.WASM_TOOLS_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests/web-sys
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: just components
      - run: just site
      - run: |
          mkdir -p /tmp/diag && cd /tmp/diag && npm i tachometer@0.7.1 selenium-webdriver@4 chromedriver@152 --silent
          cat > diag.mjs <<'EOS'
          import { Server } from 'tachometer/lib/server.js';
          import webdriver from 'selenium-webdriver';
          import chrome from 'selenium-webdriver/chrome.js';
          import 'chromedriver';
          const root = process.argv[2];
          const s = await Server.start({ host: '127.0.0.1', ports: [0], root, resolveBareModules: true, mountPoints: [{ diskPath: root, urlPath: '/' }], cache: false, npmInstalls: [] });
          const url = s.url + '/bench.html?app=dioxus-bench&receiver=native&transport=direct&op=create-1k';
          const opts = new chrome.Options(); opts.addArguments('--headless', '--window-size=1024,768');
          const prefs = new webdriver.logging.Preferences(); prefs.setLevel('browser', webdriver.logging.Level.ALL); opts.setLoggingPrefs(prefs);
          const driver = await new webdriver.Builder().forBrowser('chrome').setChromeOptions(opts).build();
          const first = (await driver.getAllWindowHandles())[0];
          await driver.executeScript('window.open("", "", "noopener=yes");');
          const handles = await driver.getAllWindowHandles();
          await driver.switchTo().window(handles.find((h) => h !== first));
          const t0 = Date.now();
          await driver.get(url);
          console.log('after get:', Date.now() - t0, 'ms');
          for (let i = 0; i < 40; i++) {
            await new Promise((r) => setTimeout(r, 500));
            const st = await driver.executeScript('return JSON.stringify({ t: window.tachometerResult, r: window.__benchResult, vis: document.visibilityState, bench: !!document.getElementById("bench"), sd: !!(globalThis.__streamDom && globalThis.__streamDom.mounted) })');
            console.log(Date.now() - t0, 'ms', st);
            if (JSON.parse(st).t !== undefined || JSON.parse(st).r) break;
          }
          for (const e of await driver.manage().logs().get('browser')) console.log('browserlog:', e.level.name, e.message.slice(0, 500));
          await driver.quit(); await s.close();
          EOS
          node diag.mjs "$GITHUB_WORKSPACE/dist"
      - run: deno run -A bench/run.ts --sample-size 2 --filter dioxus-bench/native/direct/create-1k
        continue-on-error: true
