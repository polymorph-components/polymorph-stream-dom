# Runs the tachometer benchmark matrix and publishes results to the
# `gh-pages` branch's `bench/` history (dispatch: "bench" track), read by
# github-action-benchmark's own chart page and by pages.yml's copy into
# `dist/bench/`.
name: diag

on:
  push:
    branches: [bench-diag]

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DENO_VERSION: "2.9.5"
  WASM_TOOLS_VERSION: "1.247.0"
  JUST_VERSION: "1.54.0"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
          components: clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-tools@${{ env.WASM_TOOLS_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests/web-sys
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: just components
      - run: just site
      - run: |
          mkdir -p /tmp/diag && cd /tmp/diag && npm i tachometer@0.7.1 playwright@1.63.0 --silent
          npx playwright install chromium
          cat > diag.mjs <<'EOS'
          import { Server } from 'tachometer/lib/server.js';
          import { chromium } from 'playwright';
          const root = process.argv[2];
          const s = await Server.start({ host: '127.0.0.1', ports: [0], root, resolveBareModules: true, mountPoints: [{ diskPath: root, urlPath: '/' }], cache: false, npmInstalls: [] });
          const url = s.url + '/bench.html?app=dioxus-bench&receiver=native&transport=direct&op=create-1k';
          for (const opts of [{ channel: 'chrome', headless: true }, { channel: 'chrome', headless: true, args: ['--headless=new'] }, {}]) {
            console.log('=== launch', JSON.stringify(opts));
            const b = await chromium.launch(opts);
            const first = await b.newPage(); await first.goto('about:blank');
            const page = await b.newPage();
            page.on('console', (m) => console.log('console:', m.type(), m.text().slice(0, 400)));
            page.on('pageerror', (e) => console.log('pageerror:', String(e).slice(0, 800)));
            page.on('response', (r) => { if (r.status() >= 400) console.log('http', r.status(), r.url()); });
            const t0 = Date.now();
            await page.goto(url);
            console.log('visibility:', await page.evaluate(() => document.visibilityState));
            console.log('raf fired within 2s:', await page.evaluate(() => new Promise((r) => { requestAnimationFrame(() => r(true)); setTimeout(() => r(false), 2000); })));
            await page.waitForTimeout(12000);
            console.log('result after', Date.now() - t0, 'ms:', JSON.stringify(await page.evaluate(() => ({ r: globalThis.__benchResult, t: globalThis.tachometerResult }))));
            console.log('chrome version:', b.version());
            await b.close();
          }
          await s.close();
          EOS
          node diag.mjs "$GITHUB_WORKSPACE/dist"
      - run: deno run -A bench/run.ts --sample-size 2 --filter dioxus-bench/native/direct/create-1k
        continue-on-error: true
