# Builds and deploys the demo site to GitHub Pages. Runs the same
# toolchain-setup steps as ci.yml (kept in sync manually — see that file's
# header comment on why gate bodies live in the justfile, not here).
name: pages

on:
  push:
    branches: [main]
  # Redeploy after a bench run so its gh-pages history lands under /bench/.
  workflow_run:
    workflows: [bench]
    types: [completed]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DENO_VERSION: "2.9.5"
  WASM_TOOLS_VERSION: "1.247.0"
  JUST_VERSION: "1.54.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2
          components: clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ env.JUST_VERSION }},wasm-tools@${{ env.WASM_TOOLS_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            guests/web-sys
      - run: just components
      - run: just site
      # gh-pages branch may not exist yet on the very first run —
      # continue-on-error, and the copy step below no-ops via `2>/dev/null`
      # if the checkout produced nothing.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-data
      - run: cp -r gh-pages-data/bench dist/bench 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
