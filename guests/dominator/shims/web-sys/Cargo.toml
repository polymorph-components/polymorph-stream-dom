# A hand-written stand-in for `web-sys`, translating the browser API onto
# the shadow DOM in `stream-dom-fakedom`.
#
# The `[features]` block below is not optional decoration: cargo fails on a
# feature a dependency requests but the package does not declare, so every
# web-sys feature dominator, gloo-events and the todomvc port enable has to
# exist here. They are all no-ops -- this crate has no conditional
# compilation.
[package]
name = "web-sys"
version = "0.3.105"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasm-bindgen = { path = "../wasm-bindgen" }
js-sys = { path = "../js-sys" }
stream-dom-fakedom = { path = "../../fakedom" }
stream-dom-guest = { path = "../../../../crates/stream-dom-guest" }

[dev-dependencies]
prost = { version = "0.14", default-features = false, features = ["derive"] }

[features]
# Declared so cargo accepts the requests; every one is a no-op, this
# crate has no conditional compilation.
CharacterData = []
Comment = []
CssRule = []
CssRuleList = []
CssStyleDeclaration = []
CssStyleRule = []
CssStyleSheet = []
DataTransfer = []
Document = []
DomTokenList = []
DragEvent = []
Element = []
Event = []
EventTarget = []
FocusEvent = []
History = []
InputEvent = []
HtmlElement = []
HtmlHeadElement = []
HtmlInputElement = []
HtmlStyleElement = []
HtmlTextAreaElement = []
KeyboardEvent = []
Location = []
MediaQueryList = []
MouseEvent = []
AnimationEvent = []
WheelEvent = []
Node = []
PointerEvent = []
ScrollBehavior = []
ScrollIntoViewOptions = []
ScrollLogicalPosition = []
ShadowRoot = []
ShadowRootInit = []
ShadowRootMode = []
StyleSheet = []
SvgElement = []
Text = []
Touch = []
TouchEvent = []
TouchList = []
UiEvent = []
Window = []
Storage = []
Url = []
console = []
AddEventListenerOptions = []
HashChangeEvent = []
PopStateEvent = []
