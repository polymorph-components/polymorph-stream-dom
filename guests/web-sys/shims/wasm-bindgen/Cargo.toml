# A hand-written stand-in for `wasm-bindgen`, backed by real Rust values
# instead of a JS heap. Version `0.2.128` so it satisfies dominator's
# `0.2.48` and gloo-events' requirement through the workspace
# `[patch.crates-io]`.
#
# There is no proc macro here: `#[wasm_bindgen]` is deliberately absent.
# The strategy only works for a graph with zero macro uses, which
# dominator + futures-signals + gloo-events is.
[package]
name = "wasm-bindgen"
version = "0.2.128"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# dominator's default feature is `wasm-bindgen/enable-interning`. Interning
# is a no-op here (see `intern`), but the feature name must exist.
# `uuid` writes `wasm-bindgen?/std`; the feature has to exist.
std = []
enable-interning = []
default = ["std"]
