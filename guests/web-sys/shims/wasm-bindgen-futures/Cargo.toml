# A hand-written stand-in for `wasm-bindgen-futures`. `spawn_local` is the
# only thing dominator uses (dominator-0.5.38/src/operations.rs:26), and
# here it forwards to the component-model async runtime's task spawner.
[package]
name = "wasm-bindgen-futures"
version = "0.4.55"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasm-bindgen = { path = "../wasm-bindgen" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same pin and features as the root workspace: the async runtime state is
# shared with `stream-dom-guest`, so the versions must unify.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }
