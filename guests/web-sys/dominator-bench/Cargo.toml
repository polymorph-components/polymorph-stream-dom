# The Dominator half of the cross-producer benchmark. Twin of
# `guests/dioxus/bench`; see src/lib.rs for the shared contract.
[package]
name = "dominator-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stream-dom-fakedom = { path = "../fakedom" }
dominator = "=0.5.38"
futures-signals = "0.3"
# Both resolve to the shims through the workspace `[patch.crates-io]`;
# `web-sys` is the real crates.io crate.
wasm-bindgen = "0.2"
web-sys = { version = "0.3" }

[dev-dependencies]
# The mount smoke test (tests/mount.rs) runs the real app natively.
prost = { version = "0.14", default-features = false, features = ["derive"] }
stream-dom-guest = { path = "../../../crates/stream-dom-guest" }
wasm-bindgen-futures = "0.4"
