# The shadow DOM behind the `web-sys` shim, and the `polymorph:stream-dom`
# producer driver that turns its mutations into `Frame`s.
[package]
name = "stream-dom-fakedom"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasm-bindgen = { path = "../shims/wasm-bindgen" }
stream-dom-guest = { path = "../../../crates/stream-dom-guest" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same pin and features as the root workspace: the async runtime state is
# shared with `stream-dom-guest`, so the versions must unify.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }

[dev-dependencies]
prost = { version = "0.14", default-features = false, features = ["derive"] }
