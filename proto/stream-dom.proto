// polymorph:stream-dom — wire schema of the mutation stream.
//
// DRAFT. Normative for every byte on the mutation stream; event payloads
// are proto/stream-dom-events.proto, and docs/design.md records the
// reasons. WIT (wit/stream-dom.wit) carries only what the component model
// must: functions, resources, the stream itself. No data type is defined
// in both places, except that the observer payloads carry a `Rect` / `Size`
// structurally equal to the `queries` records.
//
// PROTOCOL VERSION: 1
//
// Stream layout: standard length-delimited messages — varint byte length,
// then one Frame, repeated. No header. Additive change (a new oneof case,
// field or enum value) bumps PROTOCOL VERSION above; changing an existing
// field also bumps the package version, and instantiation is
// digest-checked. An open receiver (no policy) skips wire content it does
// not know; a receiver enforcing a policy rejects it, and a policy pins
// the version it was written against — docs/design.md "Policy".
//
// Invariants every producer upholds and every transformer preserves:
// - Every op names its target(s) explicitly. No implicit stack, cursor or
//   "current node". This is what makes a bounded-window coalescer possible.
// - An Intern precedes the first use of its slot in the same stream and is
//   emitted once per producer instance. Transformers never drop an Intern.
// - Node ids are producer-allocated, per stream, and never reused. 0 is
//   the mount root. Remove frees the subtree's nodes, not its ids: the
//   reverse channel (handle-event) is not ordered against this stream, so a
//   reused id could deliver a stale event to the wrong node. An event for
//   an unknown id is dropped.

syntax = "proto3";

package polymorph.stream_dom;

// One frame: at most one op, plus the batch-boundary flag.
//
// `commit` marks the last frame of a batch. It is a signal, not a
// buffering instruction: after-commit work (synthetic `mounted`, islands)
// runs once the frame's op, if any, is applied. A frame with no op set is
// legal only when it commits (an empty batch). A transformer that drops
// the frame carrying the flag re-emits it on the batch's last surviving
// frame, or on an op-less frame if none survives; one that merges batches
// sets it once, on the final frame. Receivers honor the flag after the op
// whatever the field order in the frame.
//
// Field numbers 1-15 encode as one tag byte, 16+ as two. `commit` rides on
// the hottest frames and takes 1; ops are ordered roughly by frequency so
// the two-byte tag lands on a rare one. A receiver that does not know an
// op case skips the frame (still honoring `commit`).
message Frame {
  bool commit = 1;
  oneof op {
    InsertBefore insert_before = 2;
    SetText set_text = 3;
    SetAttribute set_attribute = 4;
    SetProperty set_property = 5;
    CreateElement create_element = 6;
    CreateText create_text = 7;
    // Detach and free the subtree rooted at this id.
    Remove remove = 8;
    CloneTemplate clone_template = 9;
    BindPath bind_path = 10;
    // A comment node used as an insertion anchor for fragments.
    CreatePlaceholder create_placeholder = 11;
    AddListener add_listener = 12;
    RemoveListener remove_listener = 13;
    Intern intern = 14;
    RegisterTemplate register_template = 15;
    InsertAfter insert_after = 16;
    BindMarker bind_marker = 17;
  }
}

// Interned string slots (`str_ref` fields) and node ids are uint32 varints.

// Define (or overwrite) interned slot `id`.
message Intern {
  uint32 id = 1;
  string s = 2;
}

// Create a detached element. `ns` is an interned namespace URI.
message CreateElement {
  uint32 id = 1;
  uint32 tag = 2;
  optional uint32 ns = 3;
}

// Create a detached text node.
message CreateText {
  uint32 id = 1;
  string text = 2;
}

message CreatePlaceholder {
  uint32 id = 1;
}

// Insert `id` before `anchor`, or append it to `parent` when there is no
// `anchor`. `parent` is required without an `anchor` and optional with
// one (the anchor's parent is then implied, as in the DOM's insertBefore);
// a frame with neither is an error. Producers whose renderer never names
// a parent (Dioxus) omit it; a coalescer keys the op on the anchor's
// subtree. Moving an already-inserted node is allowed and is exactly what
// the DOM's insertBefore does; receivers prefer moveBefore where
// available so the move preserves node state.
message InsertBefore {
  optional uint32 parent = 1;
  uint32 id = 2;
  optional uint32 anchor = 3;
}

// Insert `id` immediately after `anchor` (under `parent`, which is
// optional and implied by the anchor). The DOM has no insertAfter, but
// diffing renderers emit "insert after this sibling" for list appends,
// and without this op a producer either tracks every node's next sibling
// or moves the anchor around the new nodes. Same move semantics as
// InsertBefore.
message InsertAfter {
  optional uint32 parent = 1;
  uint32 id = 2;
  uint32 anchor = 3;
}

message Remove {
  uint32 id = 1;
}

// Set a text node's content.
message SetText {
  uint32 id = 1;
  string text = 2;
}

// Set or remove (no `value`) an attribute. The producer adapter decides
// attribute vs property using its framework's own table. `asset` is an
// opaque handle the receiver materializes into a URL (a content hash by
// convention, but the receiver's `resolveAsset` decides); the producer
// never names a URL through it — docs/design.md "Assets".
message SetAttribute {
  uint32 id = 1;
  uint32 name = 2;
  optional uint32 ns = 3;
  oneof value {
    string text = 4;
    bytes asset = 5;
  }
}

// Set a DOM property (`value`, `checked`, `innerHTML`, ...) to a typed
// value. No `value` case set deletes / sets undefined.
message SetProperty {
  uint32 id = 1;
  uint32 name = 2;
  oneof value {
    string text = 3;
    sint64 int = 4;
    double float = 5;
    bool boolean = 6;
  }
}

// The two receiver-side singletons a producer can listen on without
// creating them. Frameworks register `popstate`, `hashchange`, `resize`,
// `visibilitychange`, media-query and global keyboard listeners here, and
// nothing in the tree under the mount root stands in for them.
enum Global {
  WINDOW = 0;
  DOCUMENT = 1;
}

// Listener registration.
//
// The target is a node id or a global. `bubbles` is the producer's
// verdict for this event name; the receiver delegates bubbling events at
// the mount root and attaches non-bubbling ones per element (globals are
// always attached directly), and needs the same bit on removal.
// `prevent_default` / `stop_propagation` are the declarative path a remote
// receiver can honor without a round trip; see docs/design.md "Events".
message Listener {
  oneof target {
    uint32 id = 1;
    Global global = 8;
  }
  uint32 name = 2;
  bool bubbles = 3;
  bool capture = 4;
  bool passive = 5;
  bool prevent_default = 6;
  bool stop_propagation = 7;
}

message AddListener {
  Listener listener = 1;
}

message RemoveListener {
  Listener listener = 1;
}

// --- Templates ---
//
// Core vocabulary, not an extension: every non-diffing framework (and
// Dioxus) mounts by cloning compiled templates and binding holes, and
// without these ops a mount degrades to one create per node. A producer
// without templates (React) simply never emits them.

message TemplateAttr {
  uint32 name = 1;
  optional uint32 ns = 2;
  oneof value {
    string text = 3;
    bytes asset = 4;
  }
}

// Children are indices into the enclosing RegisterTemplate.nodes.
message TemplateElement {
  uint32 tag = 1;
  optional uint32 ns = 2;
  repeated TemplateAttr attrs = 3;
  repeated uint32 children = 4;
}

// An element hole (nested component, control-flow site). Clones as a
// placeholder to InsertBefore against. Text and attribute holes need no
// marker: BindPath to the node, then SetText / SetAttribute.
message Dynamic {}

message TemplateNode {
  oneof kind {
    TemplateElement element = 1;
    string text = 2;
    Dynamic dynamic = 3;
  }
}

// A template is a flat pre-order arena. A receiver validates indices
// (range, acyclicity) rather than trusting them. An arena rather than an
// HTML string because the HTML parser reshapes trees, which would make
// BindPath paths unreliable; a compiler that has the HTML parses it into
// the arena at build time.
message RegisterTemplate {
  uint32 id = 1;
  repeated TemplateNode nodes = 2;
  repeated uint32 roots = 3;
}

// Deep-clone template `tmpl`'s root number `root` as a detached node `id`.
message CloneTemplate {
  uint32 tmpl = 1;
  uint32 root = 2;
  uint32 id = 3;
}

// Bind `id` to the interior node of a cloned template reached from `root`
// by walking child indices in `path` (one byte per step). Positions are
// reliable here because the producer built the tree. Self-contained: the
// root is named, not implied.
message BindPath {
  uint32 root = 1;
  bytes path = 2;
  uint32 id = 3;
}

// --- Hydration ---

// Bind `id` to the prerendered node the server-side render stamped with
// `key` (an attribute on elements, a comment beside text nodes and
// placeholders; the syntax is an SSR/receiver agreement, not part of this
// stream). By marker rather than by position because the HTML parser
// reshapes the served tree — <tbody> insertion, <p> auto-close, adjacent
// text merged — so child indices from the mount root are not trustworthy.
// A missing key is a receiver error.
message BindMarker {
  uint32 key = 1;
  uint32 id = 2;
}
