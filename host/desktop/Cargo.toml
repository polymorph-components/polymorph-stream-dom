[package]
name = "stream-dom-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
stream-dom-host = { path = "../stream-dom-host" }
tauri = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
