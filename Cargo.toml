[workspace]
resolver = "2"
members = [
  "crates/stream-dom-proto",
  "crates/stream-dom-guest",
  "crates/stream-dom-dioxus",
  "guests/dioxus/todomvc",
  "guests/dioxus/bench",
]
# The Dominator guest is its own workspace: it `[patch]`es wasm-bindgen,
# js-sys, web-sys and wasm-bindgen-futures with the fake-DOM shims, and a
# patch applies workspace-wide. Dioxus's graph pulls the real wasm-bindgen
# (via subsecond) as dead code, which must not see the shims.
#
# The wasmtime host is its own workspace because this one is built for
# wasm32-wasip2 and wasmtime cannot be.
exclude = ["guests/web-sys", "host"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# `async-spawn` + `inter-task-wakeup`: the scheduler task parks on a
# Rust-originating waker and `handle-event` (a separate export task) wakes
# it; without `inter-task-wakeup` wit-bindgen 0.60 traps on the first
# cross-task wake. Same pin and reason as polyengine-dioxus.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-build = "0.14"
protox = "0.9"
rustc-hash = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
